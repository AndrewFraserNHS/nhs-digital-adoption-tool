<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Impact Assessment Tool</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Icons (Inline SVGs to replace Lucide dependency) ---
        const Icon = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
        const BarChart2 = (props) => <Icon {...props}><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></Icon>;
        const FileText = (props) => <Icon {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></Icon>;
        const Info = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></Icon>;
        const Save = (props) => <Icon {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></Icon>;
        const Download = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>;
        const HelpCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></Icon>;
        const ChevronDown = (props) => <Icon {...props}><polyline points="6 9 12 15 18 9"></polyline></Icon>;
        const ChevronUp = (props) => <Icon {...props}><polyline points="18 15 12 9 6 15"></polyline></Icon>;
        const Filter = (props) => <Icon {...props}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></Icon>;
        const Calendar = (props) => <Icon {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></Icon>;
        const RefreshCw = (props) => <Icon {...props}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></Icon>;
        const ArrowUpDown = (props) => <Icon {...props}><path d="M7 15l5 5 5-5"></path><path d="M7 9l5-5 5 5"></path></Icon>;

        // --- Constants & Data Definitions based on PDF ---

        const SCORING_CRITERIA = {
            complexity: [
                { value: 1, label: "1 - Simple, generalist activity" },
                { value: 2, label: "2 - Simple, specialist activity" },
                { value: 3, label: "3 - Complex, generalist activity" },
                { value: 4, label: "4 - Highly complex, specialist activity" }
            ],
            frequency: [
                { value: 1, label: "1 - Once a month or less" },
                { value: 2, label: "2 - Once a week or less" },
                { value: 3, label: "3 - Once a day or less" },
                { value: 4, label: "4 - Constantly" }
            ],
            distance: [
                { value: 1, label: "1 - Same or very similar to current" },
                { value: 2, label: "2 - Less than 20% change" },
                { value: 3, label: "3 - Less than 50% change" },
                { value: 4, label: "4 - More than 80% change" }
            ],
            attitude: [
                { value: 1, label: "1 - Resistant to change" },
                { value: 2, label: "2 - Resistant but can be convinced" },
                { value: 3, label: "3 - Positive but needs clear benefits" },
                { value: 4, label: "4 - Very positive (Pull not Push)" }
            ],
            conditions: [
                { value: 1, label: "1 - Conditions not conducive" },
                { value: 2, label: "2 - >2 minor or 1 major change affecting" },
                { value: 3, label: "3 - No more than 2 minor changes" },
                { value: 4, label: "4 - Nothing to divert attention" }
            ],
            resources: [
                { value: 1, label: "1 - Challenges prevent implementation" },
                { value: 2, label: "2 - Resource challenges likely to impact" },
                { value: 3, label: "3 - Sufficient to support change" },
                { value: 4, label: "4 - Fully resourced" }
            ],
            network: [
                { value: 1, label: "1 - Not resourced" },
                { value: 2, label: "2 - Champions but not Agents" },
                { value: 3, label: "3 - Agents but not Champions" },
                { value: 4, label: "4 - Fully resourced and active" }
            ],
            // Added per recommendation: ADKAR-aligned Capability
            capability: [
                { value: 1, label: "1 - Unaware of new ways of working" },
                { value: 2, label: "2 - Awareness of new ways working" },
                { value: 3, label: "3 - Acquired knowledge/skills (Training)" },
                { value: 4, label: "4 - Confidence in using skills (Practice)" }
            ]
        };

        // --- Demo Data ---
        const demoData = [
            { id: "demo1", function: "Finance", process: "Year End Close", processRef: "FIN-001", benefitsRef: "BEN-02", peopleImpacted: 15, impactDate: "2026-03-15", complexity: 4, frequency: 1, distance: 3, attitude: 3, conditions: 3, resources: 2, network: 3, capability: 2 },
            { id: "demo2", function: "Finance", process: "Invoice Processing", processRef: "FIN-002", benefitsRef: "BEN-05", peopleImpacted: 8, impactDate: "2026-04-01", complexity: 2, frequency: 4, distance: 4, attitude: 2, conditions: 2, resources: 3, network: 2, capability: 2 },
            { id: "demo3", function: "HR", process: "New Onboarding Flow", processRef: "HR-101", benefitsRef: "BEN-10", peopleImpacted: 50, impactDate: "2026-06-01", complexity: 2, frequency: 2, distance: 3, attitude: 4, conditions: 4, resources: 4, network: 4, capability: 4 },
            { id: "demo4", function: "HR", process: "Payroll Migration", processRef: "HR-200", benefitsRef: "BEN-11", peopleImpacted: 120, impactDate: "2026-01-25", complexity: 4, frequency: 3, distance: 4, attitude: 1, conditions: 2, resources: 1, network: 1, capability: 1 },
            { id: "demo5", function: "IT", process: "Security Patch 4.0", processRef: "IT-900", benefitsRef: "BEN-20", peopleImpacted: 200, impactDate: "2026-02-15", complexity: 3, frequency: 1, distance: 2, attitude: 3, conditions: 4, resources: 4, network: 3, capability: 2 },
            { id: "demo6", function: "IT", process: "Helpdesk Ticketing", processRef: "IT-950", benefitsRef: "BEN-22", peopleImpacted: 25, impactDate: "2026-05-10", complexity: 2, frequency: 4, distance: 3, attitude: 2, conditions: 3, resources: 3, network: 2, capability: 2 },
            { id: "demo7", function: "Operations", process: "Shift Scheduling", processRef: "OPS-300", benefitsRef: "BEN-30", peopleImpacted: 300, impactDate: "2026-04-20", complexity: 3, frequency: 2, distance: 4, attitude: 1, conditions: 1, resources: 2, network: 2, capability: 1 },
            { id: "demo8", function: "Operations", process: "Inventory Audit", processRef: "OPS-400", benefitsRef: "BEN-35", peopleImpacted: 40, impactDate: "2026-11-05", complexity: 2, frequency: 1, distance: 1, attitude: 4, conditions: 4, resources: 4, network: 3, capability: 3 },
            { id: "demo9", function: "Marketing", process: "Rebrand Launch", processRef: "MKT-500", benefitsRef: "BEN-40", peopleImpacted: 12, impactDate: "2026-09-01", complexity: 4, frequency: 1, distance: 3, attitude: 4, conditions: 2, resources: 3, network: 4, capability: 3 },
            { id: "demo10", function: "Sales", process: "CRM Upgrade", processRef: "SLS-600", benefitsRef: "BEN-45", peopleImpacted: 60, impactDate: "2026-07-15", complexity: 3, frequency: 4, distance: 2, attitude: 2, conditions: 3, resources: 2, network: 2, capability: 2 },
            { id: "demo11", function: "Compliance", process: "GDPR Audit", processRef: "COM-700", benefitsRef: "BEN-50", peopleImpacted: 5, impactDate: "2026-05-20", complexity: 3, frequency: 1, distance: 2, attitude: 3, conditions: 4, resources: 3, network: 4, capability: 3 },
            { id: "demo12", function: "Legal", process: "Contract Review Sys", processRef: "LEG-800", benefitsRef: "BEN-55", peopleImpacted: 10, impactDate: "2026-08-10", complexity: 2, frequency: 3, distance: 3, attitude: 2, conditions: 3, resources: 2, network: 1, capability: 2 },
            { id: "demo13", function: "HR", process: "Performance Review", processRef: "HR-150", benefitsRef: "BEN-12", peopleImpacted: 150, impactDate: "2026-11-01", complexity: 2, frequency: 1, distance: 2, attitude: 3, conditions: 3, resources: 3, network: 3, capability: 3 },
            { id: "demo14", function: "Operations", process: "Fleet Maintenance", processRef: "OPS-450", benefitsRef: "BEN-32", peopleImpacted: 20, impactDate: "2026-06-15", complexity: 3, frequency: 2, distance: 2, attitude: 4, conditions: 4, resources: 4, network: 4, capability: 4 },
            { id: "demo15", function: "Finance", process: "Budget Planning", processRef: "FIN-005", benefitsRef: "BEN-03", peopleImpacted: 10, impactDate: "2026-10-01", complexity: 4, frequency: 1, distance: 2, attitude: 2, conditions: 1, resources: 2, network: 2, capability: 2 },
            { id: "demo16", function: "IT", process: "Cloud Migration", processRef: "IT-990", benefitsRef: "BEN-25", peopleImpacted: 15, impactDate: "2026-12-01", complexity: 4, frequency: 4, distance: 4, attitude: 3, conditions: 2, resources: 3, network: 3, capability: 2 }
        ];

        // --- Helper Components ---

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-lg shadow-sm border border-slate-200 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ onClick, children, variant = "primary", className = "", ...props }) => {
            const baseStyle = "px-4 py-2 rounded-md font-medium transition-colors flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-1";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 focus:ring-blue-500",
                secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200 focus:ring-slate-400",
                danger: "bg-red-50 text-red-600 hover:bg-red-100 focus:ring-red-400",
                outline: "border border-slate-300 text-slate-700 hover:bg-slate-50",
                ghost: "text-slate-500 hover:text-blue-600 hover:bg-blue-50"
            };
            return (
                <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        const ScoreBadge = ({ score, type }) => {
            let colorClass = "bg-slate-100 text-slate-800";
            
            // Logic: High change score = Red (High Impact/Risk). High Readiness score = Green (Good).
            if (type === 'change') {
                if (score >= 70) colorClass = "bg-red-100 text-red-800 border-red-200";
                else if (score >= 40) colorClass = "bg-amber-100 text-amber-800 border-amber-200";
                else colorClass = "bg-green-100 text-green-800 border-green-200";
            } else {
                // Readiness: High is good
                if (score >= 70) colorClass = "bg-green-100 text-green-800 border-green-200";
                else if (score >= 40) colorClass = "bg-amber-100 text-amber-800 border-amber-200";
                else colorClass = "bg-red-100 text-red-800 border-red-200";
            }

            return (
                <span className={`px-2 py-1 rounded-full text-xs font-bold border ${colorClass}`}>
                    {score.toFixed(0)}%
                </span>
            );
        };

        // --- Main Application Component ---

        function ChangeImpactApp() {
            const [activeTab, setActiveTab] = useState('assessment');
            const [items, setItems] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const fileInputRef = useRef(null);
            
            // Form State
            const initialFormState = {
                id: null,
                function: '',
                process: '',
                processRef: '',
                benefitsRef: '',
                peopleImpacted: 0,
                impactDate: '',
                complexity: 1,
                frequency: 1,
                distance: 1,
                attitude: 2,
                conditions: 2,
                resources: 2,
                network: 1,
                capability: 1 // Default for new capability field
            };
            const [formData, setFormData] = useState(initialFormState);

            // Load from local storage on mount
            useEffect(() => {
                const saved = localStorage.getItem('changeImpactData');
                if (saved) {
                    try {
                        setItems(JSON.parse(saved));
                    } catch (e) {
                        console.error("Failed to load data", e);
                    }
                }
            }, []);

            // Save to local storage on change
            useEffect(() => {
                localStorage.setItem('changeImpactData', JSON.stringify(items));
            }, [items]);

            // Calculations based on PDF formulas
            const calculateScores = (item) => {
                // Change Score: (Complexity + Frequency + (2 * Distance)) / 16 * 100
                const changeScoreRaw = (parseInt(item.complexity) + parseInt(item.frequency) + (2 * parseInt(item.distance)));
                const changeScore = (changeScoreRaw / 16) * 100;

                // Readiness Score: (Attitude + Conditions + Resources + Network + Capability) / 20 * 100
                // We default capability to 1 if it's missing (for old data)
                const capability = item.capability ? parseInt(item.capability) : 1;
                const readinessScoreRaw = parseInt(item.attitude) + parseInt(item.conditions) + parseInt(item.resources) + parseInt(item.network) + capability;
                const readinessScore = (readinessScoreRaw / 20) * 100; // Divisor increased to 20

                return { changeScore, readinessScore };
            };

            const handleSaveItem = () => {
                if (!formData.function || !formData.process) {
                    alert("Please enter at least a Business Function and Process Name.");
                    return;
                }

                const newItem = { 
                    ...formData, 
                    id: formData.id || Date.now().toString(),
                    peopleImpacted: parseInt(formData.peopleImpacted) || 0,
                    timestamp: new Date().toISOString()
                };

                if (formData.id) {
                    setItems(items.map(i => i.id === formData.id ? newItem : i));
                } else {
                    setItems([...items, newItem]);
                }
                
                setFormData(initialFormState);
                setShowForm(false);
            };

            const handleEdit = (item) => {
                setFormData({
                    ...item,
                    capability: item.capability || 1 // Ensure old items have default capability when editing
                });
                setShowForm(true);
                setActiveTab('assessment');
            };

            const handleDelete = (id) => {
                if (window.confirm("Are you sure you want to delete this assessment?")) {
                    setItems(items.filter(i => i.id !== id));
                }
            };

            const handleExportCSV = () => {
                const headers = ["Function", "Process", "Process Ref", "Benefit Ref", "People Impacted", "Impact Date", "Change Score", "Readiness Score", "Complexity", "Frequency", "Distance", "Attitude", "Conditions", "Resources", "Network", "Capability"];
                const rows = items.map(item => {
                    const { changeScore, readinessScore } = calculateScores(item);
                    return [
                        `"${item.function}"`,
                        `"${item.process}"`,
                        `"${item.processRef || ''}"`,
                        `"${item.benefitsRef || ''}"`,
                        item.peopleImpacted,
                        item.impactDate,
                        `${changeScore.toFixed(2)}%`,
                        `${readinessScore.toFixed(2)}%`,
                        item.complexity,
                        item.frequency,
                        item.distance,
                        item.attitude,
                        item.conditions,
                        item.resources,
                        item.network,
                        item.capability || 1 // Export capability
                    ].join(",");
                });

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "change_impact_assessment.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportClick = () => {
                fileInputRef.current?.click();
            };

            const handleImportCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    try {
                        const lines = text.split('\n').map(line => line.trim()).filter(line => line);
                        if (lines.length < 2) return; 

                        const parseCSVLine = (text) => {
                            const result = [];
                            let current = '';
                            let inQuotes = false;
                            
                            for (let i = 0; i < text.length; i++) {
                                const char = text[i];
                                const nextChar = text[i + 1];
                                
                                if (inQuotes) {
                                    if (char === '"' && nextChar === '"') {
                                        current += '"';
                                        i++; 
                                    } else if (char === '"') {
                                        inQuotes = false;
                                    } else {
                                        current += char;
                                    }
                                } else {
                                    if (char === '"') {
                                        inQuotes = true;
                                    } else if (char === ',') {
                                        result.push(current);
                                        current = '';
                                    } else {
                                        current += char;
                                    }
                                }
                            }
                            result.push(current);
                            return result;
                        };

                        const newItems = [];
                        for (let i = 1; i < lines.length; i++) {
                            const row = parseCSVLine(lines[i]);
                            
                            // Updated mapping for CSV with Capability (16 columns)
                            if (row.length >= 16) {
                                newItems.push({
                                    id: Date.now() + Math.random(),
                                    function: row[0],
                                    process: row[1],
                                    processRef: row[2] || '',
                                    benefitsRef: row[3] || '',
                                    peopleImpacted: parseInt(row[4]) || 0,
                                    impactDate: row[5],
                                    complexity: parseInt(row[8]) || 1,
                                    frequency: parseInt(row[9]) || 1,
                                    distance: parseInt(row[10]) || 1,
                                    attitude: parseInt(row[11]) || 2,
                                    conditions: parseInt(row[12]) || 2,
                                    resources: parseInt(row[13]) || 2,
                                    network: parseInt(row[14]) || 1,
                                    capability: parseInt(row[15]) || 1, // Import Capability
                                    timestamp: new Date().toISOString()
                                });
                            } 
                            // Fallback for previous version (15 columns - Refs but no Capability)
                            else if (row.length >= 15) {
                                newItems.push({
                                    id: Date.now() + Math.random(),
                                    function: row[0],
                                    process: row[1],
                                    processRef: row[2] || '',
                                    benefitsRef: row[3] || '',
                                    peopleImpacted: parseInt(row[4]) || 0,
                                    impactDate: row[5],
                                    complexity: parseInt(row[8]) || 1,
                                    frequency: parseInt(row[9]) || 1,
                                    distance: parseInt(row[10]) || 1,
                                    attitude: parseInt(row[11]) || 2,
                                    conditions: parseInt(row[12]) || 2,
                                    resources: parseInt(row[13]) || 2,
                                    network: parseInt(row[14]) || 1,
                                    capability: 1, // Default
                                    timestamp: new Date().toISOString()
                                });
                            }
                            // Fallback for oldest version
                            else if (row.length >= 13) {
                                newItems.push({
                                    id: Date.now() + Math.random(),
                                    function: row[0],
                                    process: row[1],
                                    processRef: '',
                                    benefitsRef: '',
                                    peopleImpacted: parseInt(row[2]) || 0,
                                    impactDate: row[3],
                                    complexity: parseInt(row[6]) || 1,
                                    frequency: parseInt(row[7]) || 1,
                                    distance: parseInt(row[8]) || 1,
                                    attitude: parseInt(row[9]) || 2,
                                    conditions: parseInt(row[10]) || 2,
                                    resources: parseInt(row[11]) || 2,
                                    network: parseInt(row[12]) || 1,
                                    capability: 1, // Default
                                    timestamp: new Date().toISOString()
                                });
                            }
                        }
                        
                        if (newItems.length > 0) {
                            if(window.confirm(`Found ${newItems.length} valid records. Append them to your current list? (Cancel to Replace)`)) {
                                setItems(prev => [...prev, ...newItems]);
                            } else {
                                setItems(newItems);
                            }
                            alert("Import successful!");
                        } else {
                            alert("Could not parse any valid records. Please ensure CSV matches the export format.");
                        }
                    } catch (err) {
                        console.error("Import Error:", err);
                        alert("Failed to import CSV. Please check the file format.");
                    }
                    event.target.value = null;
                };
                reader.readAsText(file);
            };

            const loadDemoData = () => {
                if(window.confirm("This will load sample data for testing. Add to existing data? (Cancel to Replace)")) {
                    setItems(prev => [...prev, ...demoData]);
                } else {
                    setItems(demoData);
                }
            };

            // --- Views ---

            const AssessmentView = () => {
                const [sortConfig, setSortConfig] = useState({ key: null, direction: 'ascending' });
                const [filters, setFilters] = useState({ function: '', process: '' });

                const handleSort = (key) => {
                    let direction = 'ascending';
                    if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                        direction = 'descending';
                    }
                    setSortConfig({ key, direction });
                };

                const sortedAndFilteredItems = useMemo(() => {
                    let actionableItems = [...items];

                    if (filters.function) {
                        actionableItems = actionableItems.filter(item => item.function.toLowerCase().includes(filters.function.toLowerCase()));
                    }
                    if (filters.process) {
                        actionableItems = actionableItems.filter(item => item.process.toLowerCase().includes(filters.process.toLowerCase()));
                    }

                    if (sortConfig.key) {
                        actionableItems.sort((a, b) => {
                            let aValue = a[sortConfig.key];
                            let bValue = b[sortConfig.key];

                            if (sortConfig.key === 'changeScore' || sortConfig.key === 'readinessScore') {
                                aValue = calculateScores(a)[sortConfig.key];
                                bValue = calculateScores(b)[sortConfig.key];
                            }

                            if (typeof aValue === 'string') aValue = aValue.toLowerCase();
                            if (typeof bValue === 'string') bValue = bValue.toLowerCase();
                            if (sortConfig.key === 'peopleImpacted') {
                                aValue = parseInt(aValue) || 0;
                                bValue = parseInt(bValue) || 0;
                            }

                            if (aValue < bValue) {
                                return sortConfig.direction === 'ascending' ? -1 : 1;
                            }
                            if (aValue > bValue) {
                                return sortConfig.direction === 'ascending' ? 1 : -1;
                            }
                            return 0;
                        });
                    }
                    return actionableItems;
                }, [items, sortConfig, filters]);

                const SortIcon = ({ column }) => {
                    if (sortConfig.key !== column) return <ArrowUpDown size={14} className="text-slate-300 ml-1 inline" />;
                    return sortConfig.direction === 'ascending' 
                        ? <ChevronUp size={14} className="text-blue-600 ml-1 inline" />
                        : <ChevronDown size={14} className="text-blue-600 ml-1 inline" />;
                };

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <h2 className="text-xl font-semibold text-slate-800">Detailed Impact Assessments</h2>
                            <div className="flex flex-wrap gap-2">
                                <input 
                                    type="file" 
                                    ref={fileInputRef} 
                                    onChange={handleImportCSV} 
                                    accept=".csv" 
                                    className="hidden" 
                                />
                                <Button variant="ghost" onClick={loadDemoData}>
                                    <RefreshCw size={16} /> Load Demo Data
                                </Button>
                                <Button variant="outline" onClick={handleImportClick}>
                                    <Upload size={16} /> Import CSV
                                </Button>
                                <Button variant="outline" onClick={handleExportCSV} disabled={items.length === 0}>
                                    <Download size={16} /> Export CSV
                                </Button>
                                <Button onClick={() => { setFormData(initialFormState); setShowForm(!showForm); }}>
                                    {showForm ? "Cancel" : <React.Fragment><Plus size={16} /> New Assessment</React.Fragment>}
                                </Button>
                            </div>
                        </div>

                        {showForm && (
                            <Card className="p-6 bg-blue-50 border-blue-100">
                                <h3 className="text-lg font-medium text-blue-900 mb-4">{formData.id ? "Edit Assessment" : "New Assessment"}</h3>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    <div className="space-y-4">
                                        <h4 className="font-semibold text-blue-800 border-b border-blue-200 pb-1">1. Process Details</h4>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Business Function</label>
                                            <input 
                                                type="text" 
                                                className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none"
                                                placeholder="e.g. HR, Finance"
                                                value={formData.function}
                                                onChange={e => setFormData({...formData, function: e.target.value})}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Process Name</label>
                                            <input 
                                                type="text" 
                                                className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none"
                                                placeholder="e.g. Payroll Run"
                                                value={formData.process}
                                                onChange={e => setFormData({...formData, process: e.target.value})}
                                            />
                                        </div>
                                        
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Process Ref # <span className="text-xs text-slate-400 font-normal">(Optional)</span></label>
                                                <input 
                                                    type="text" 
                                                    className="w-full p-2 border border-slate-300 rounded outline-none"
                                                    placeholder="e.g. P-101"
                                                    value={formData.processRef}
                                                    onChange={e => setFormData({...formData, processRef: e.target.value})}
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Benefit Ref # <span className="text-xs text-slate-400 font-normal">(Optional)</span></label>
                                                <input 
                                                    type="text" 
                                                    className="w-full p-2 border border-slate-300 rounded outline-none"
                                                    placeholder="e.g. B-05"
                                                    value={formData.benefitsRef}
                                                    onChange={e => setFormData({...formData, benefitsRef: e.target.value})}
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1"># Impacted</label>
                                                <input 
                                                    type="number" 
                                                    className="w-full p-2 border border-slate-300 rounded outline-none"
                                                    value={formData.peopleImpacted}
                                                    onChange={e => setFormData({...formData, peopleImpacted: e.target.value})}
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Impact Date</label>
                                                <input 
                                                    type="date" 
                                                    className="w-full p-2 border border-slate-300 rounded outline-none"
                                                    value={formData.impactDate}
                                                    onChange={e => setFormData({...formData, impactDate: e.target.value})}
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <h4 className="font-semibold text-blue-800 border-b border-blue-200 pb-1">2. Change Impact</h4>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Complexity</label>
                                            <select 
                                                className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                value={formData.complexity}
                                                onChange={e => setFormData({...formData, complexity: parseInt(e.target.value)})}
                                            >
                                                {SCORING_CRITERIA.complexity.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Frequency</label>
                                            <select 
                                                className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                value={formData.frequency}
                                                onChange={e => setFormData({...formData, frequency: parseInt(e.target.value)})}
                                            >
                                                {SCORING_CRITERIA.frequency.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Distance (x2 Weight)</label>
                                            <select 
                                                className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                value={formData.distance}
                                                onChange={e => setFormData({...formData, distance: parseInt(e.target.value)})}
                                            >
                                                {SCORING_CRITERIA.distance.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <h4 className="font-semibold text-blue-800 border-b border-blue-200 pb-1">3. Business Readiness</h4>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Attitude</label>
                                            <select 
                                                className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                value={formData.attitude}
                                                onChange={e => setFormData({...formData, attitude: parseInt(e.target.value)})}
                                            >
                                                {SCORING_CRITERIA.attitude.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Conditions</label>
                                            <select 
                                                className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                value={formData.conditions}
                                                onChange={e => setFormData({...formData, conditions: parseInt(e.target.value)})}
                                            >
                                                {SCORING_CRITERIA.conditions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Resources</label>
                                                <select 
                                                    className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                    value={formData.resources}
                                                    onChange={e => setFormData({...formData, resources: parseInt(e.target.value)})}
                                                >
                                                    {SCORING_CRITERIA.resources.map(opt => <option key={opt.value} value={opt.value}>{opt.value}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Network</label>
                                                <select 
                                                    className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                    value={formData.network}
                                                    onChange={e => setFormData({...formData, network: parseInt(e.target.value)})}
                                                >
                                                    {SCORING_CRITERIA.network.map(opt => <option key={opt.value} value={opt.value}>{opt.value}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        {/* Added Capability Dropdown */}
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Capability (ADKAR)</label>
                                            <select 
                                                className="w-full p-2 border border-slate-300 rounded outline-none text-sm"
                                                value={formData.capability}
                                                onChange={e => setFormData({...formData, capability: parseInt(e.target.value)})}
                                            >
                                                {SCORING_CRITERIA.capability.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="mt-6 flex justify-end gap-3">
                                    <Button variant="secondary" onClick={() => setShowForm(false)}>Cancel</Button>
                                    <Button onClick={handleSaveItem}><Save size={16} /> Save Assessment</Button>
                                </div>
                            </Card>
                        )}

                        <Card className="overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left border-collapse">
                                    <thead className="bg-slate-50 text-slate-600 font-medium border-b border-slate-200">
                                        <tr>
                                            <th className="px-4 py-3 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('function')}>
                                                <div className="flex items-center">Function <SortIcon column="function"/></div>
                                            </th>
                                            <th className="px-4 py-3 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('process')}>
                                                <div className="flex items-center">Process <SortIcon column="process"/></div>
                                            </th>
                                            <th className="px-2 py-3 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('processRef')}>
                                                <div className="flex items-center">Ref # <SortIcon column="processRef"/></div>
                                            </th>
                                            <th className="px-2 py-3 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('benefitsRef')}>
                                                <div className="flex items-center">Ben # <SortIcon column="benefitsRef"/></div>
                                            </th>
                                            <th className="px-4 py-3 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('peopleImpacted')}>
                                                <div className="flex items-center"># Impacted <SortIcon column="peopleImpacted"/></div>
                                            </th>
                                            <th className="px-4 py-3 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('impactDate')}>
                                                <div className="flex items-center">Date <SortIcon column="impactDate"/></div>
                                            </th>
                                            <th className="px-4 py-3 text-center cursor-pointer hover:bg-slate-100" onClick={() => handleSort('changeScore')}>
                                                <div className="flex items-center justify-center">Change Score <SortIcon column="changeScore"/></div>
                                            </th>
                                            <th className="px-4 py-3 text-center cursor-pointer hover:bg-slate-100" onClick={() => handleSort('readinessScore')}>
                                                <div className="flex items-center justify-center">Readiness Score <SortIcon column="readinessScore"/></div>
                                            </th>
                                            <th className="px-4 py-3 text-right">Actions</th>
                                        </tr>
                                        <tr className="bg-slate-50">
                                            <th className="px-4 py-2">
                                                <input 
                                                    type="text" 
                                                    placeholder="Filter Function..." 
                                                    className="w-full px-2 py-1 text-xs border border-slate-300 rounded focus:ring-1 focus:ring-blue-500 outline-none font-normal"
                                                    value={filters.function}
                                                    onChange={(e) => setFilters(prev => ({ ...prev, function: e.target.value }))}
                                                />
                                            </th>
                                            <th className="px-4 py-2">
                                                <input 
                                                    type="text" 
                                                    placeholder="Filter Process..." 
                                                    className="w-full px-2 py-1 text-xs border border-slate-300 rounded focus:ring-1 focus:ring-blue-500 outline-none font-normal"
                                                    value={filters.process}
                                                    onChange={(e) => setFilters(prev => ({ ...prev, process: e.target.value }))}
                                                />
                                            </th>
                                            <th colSpan="7"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {sortedAndFilteredItems.length === 0 ? (
                                            <tr>
                                                <td colSpan="9" className="px-4 py-8 text-center text-slate-500 italic">
                                                    {items.length === 0 ? 'No assessments added yet. Click "New Assessment" to begin.' : 'No matching records found.'}
                                                </td>
                                            </tr>
                                        ) : (
                                            sortedAndFilteredItems.map(item => {
                                                const scores = calculateScores(item);
                                                return (
                                                    <tr key={item.id} className="hover:bg-slate-50 group transition-colors">
                                                        <td className="px-4 py-3 font-medium text-slate-800">{item.function}</td>
                                                        <td className="px-4 py-3 text-slate-600">{item.process}</td>
                                                        <td className="px-2 py-3 text-slate-500 text-xs">{item.processRef || '-'}</td>
                                                        <td className="px-2 py-3 text-slate-500 text-xs">{item.benefitsRef || '-'}</td>
                                                        <td className="px-4 py-3 text-slate-600">{item.peopleImpacted}</td>
                                                        <td className="px-4 py-3 text-slate-600">{item.impactDate}</td>
                                                        <td className="px-4 py-3 text-center">
                                                            <ScoreBadge score={scores.changeScore} type="change" />
                                                        </td>
                                                        <td className="px-4 py-3 text-center">
                                                            <ScoreBadge score={scores.readinessScore} type="readiness" />
                                                        </td>
                                                        <td className="px-4 py-3 text-right">
                                                            <button onClick={() => handleEdit(item)} className="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                                                            <button onClick={() => handleDelete(item.id)} className="text-red-600 hover:text-red-800">Delete</button>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    </div>
                );
            };

            const DashboardView = () => {
                const [filterFunction, setFilterFunction] = useState('All');
                const [weightedView, setWeightedView] = useState(false);
                const [heatmapOverlay, setHeatmapOverlay] = useState('count'); // 'count', 'changeScore', 'readinessScore', 'capability'
                const [readinessSort, setReadinessSort] = useState('desc'); // 'desc' | 'asc'

                const uniqueFunctions = useMemo(() => {
                    return ['All', ...new Set(items.map(item => item.function).filter(Boolean))].sort();
                }, [items]);

                const filteredItems = useMemo(() => {
                    if (filterFunction === 'All') return items;
                    return items.filter(item => item.function === filterFunction);
                }, [items, filterFunction]);

                const functionGroups = useMemo(() => {
                    const groups = {};
                    filteredItems.forEach(item => {
                        if (!groups[item.function]) groups[item.function] = { count: 0, totalReadiness: 0, totalChange: 0, totalImpacted: 0, weightedReadinessSum: 0, weightedChangeSum: 0 };
                        const scores = calculateScores(item);
                        const people = parseInt(item.peopleImpacted) || 0;
                        
                        groups[item.function].count += 1;
                        groups[item.function].totalReadiness += scores.readinessScore;
                        groups[item.function].totalChange += scores.changeScore;
                        groups[item.function].totalImpacted += people;
                        
                        groups[item.function].weightedReadinessSum += (scores.readinessScore * people);
                        groups[item.function].weightedChangeSum += (scores.changeScore * people);
                    });

                    const results = Object.keys(groups).map(key => {
                        const g = groups[key];
                        const avgReadiness = weightedView && g.totalImpacted > 0 
                            ? g.weightedReadinessSum / g.totalImpacted 
                            : g.totalReadiness / g.count;
                            
                        const avgChange = weightedView && g.totalImpacted > 0 
                            ? g.weightedChangeSum / g.totalImpacted 
                            : g.totalChange / g.count;

                        return {
                            name: key,
                            avgReadiness,
                            avgChange,
                            totalImpacted: g.totalImpacted
                        };
                    });

                    return results.sort((a, b) => {
                        if (readinessSort === 'asc') return a.avgReadiness - b.avgReadiness;
                        return b.avgReadiness - a.avgReadiness;
                    });

                }, [filteredItems, weightedView, readinessSort]);

                const kpiMetrics = useMemo(() => {
                    const totalProcesses = filteredItems.length;
                    const totalPeople = filteredItems.reduce((acc, curr) => acc + (parseInt(curr.peopleImpacted) || 0), 0);
                    
                    let avgReadiness = 0;
                    if (totalProcesses > 0) {
                        if (weightedView && totalPeople > 0) {
                            const weightedSum = filteredItems.reduce((acc, curr) => acc + (calculateScores(curr).readinessScore * (parseInt(curr.peopleImpacted) || 0)), 0);
                            avgReadiness = weightedSum / totalPeople;
                        } else {
                            avgReadiness = filteredItems.reduce((acc, curr) => acc + calculateScores(curr).readinessScore, 0) / totalProcesses;
                        }
                    }
                    return { totalProcesses, totalPeople, avgReadiness };
                }, [filteredItems, weightedView]);

                const heatmapData = useMemo(() => {
                    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    const grid = {};
                    
                    const funcs = [...new Set(filteredItems.map(i => i.function))];
                    funcs.forEach(f => {
                        // Added capabilitySum to initialization
                        grid[f] = Array.from({ length: 12 }, () => ({ count: 0, changeSum: 0, readinessSum: 0, capabilitySum: 0 }));
                    });

                    filteredItems.forEach(item => {
                        if (item.impactDate && item.function) {
                            const date = new Date(item.impactDate);
                            if (!isNaN(date)) {
                                const monthIdx = date.getMonth(); 
                                if (grid[item.function] && grid[item.function][monthIdx]) {
                                    const cell = grid[item.function][monthIdx];
                                    const { changeScore, readinessScore } = calculateScores(item);
                                    
                                    // Handle missing capability for old items
                                    const capability = item.capability ? parseInt(item.capability) : 1;

                                    cell.count += 1;
                                    cell.changeSum += changeScore;
                                    cell.readinessSum += readinessScore;
                                    cell.capabilitySum += capability;
                                }
                            }
                        }
                    });

                    return { months, grid };
                }, [filteredItems]);

                return (
                    <div className="space-y-6">
                        
                        <Card className="p-4 flex flex-col md:flex-row justify-between items-center gap-4 bg-white sticky top-0 z-10 shadow-sm">
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <div className="flex items-center gap-2 text-slate-600">
                                    <Filter size={18} />
                                    <span className="font-medium text-sm">Filter:</span>
                                </div>
                                <select 
                                    className="p-2 border border-slate-300 rounded text-sm min-w-[200px] outline-none focus:ring-2 focus:ring-blue-500"
                                    value={filterFunction}
                                    onChange={(e) => setFilterFunction(e.target.value)}
                                >
                                    {uniqueFunctions.map(f => <option key={f} value={f}>{f}</option>)}
                                </select>
                            </div>

                            <div className="flex items-center gap-2">
                                <span className={`text-sm font-medium ${!weightedView ? 'text-blue-600' : 'text-slate-500'}`}>Simple Avg</span>
                                <button 
                                    onClick={() => setWeightedView(!weightedView)}
                                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 ${weightedView ? 'bg-blue-600' : 'bg-slate-200'}`}
                                >
                                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${weightedView ? 'translate-x-6' : 'translate-x-1'}`} />
                                </button>
                                <span className={`text-sm font-medium ${weightedView ? 'text-blue-600' : 'text-slate-500'}`}>Weighted by Impact</span>
                            </div>
                        </Card>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <Card className="p-4 border-l-4 border-blue-500">
                                <h3 className="text-slate-500 text-sm font-medium uppercase">Total Processes</h3>
                                <p className="text-2xl font-bold text-slate-800">{kpiMetrics.totalProcesses}</p>
                                <p className="text-xs text-slate-400 mt-1">Filtered View</p>
                            </Card>
                            <Card className="p-4 border-l-4 border-amber-500">
                                <h3 className="text-slate-500 text-sm font-medium uppercase">Total People Impacted</h3>
                                <p className="text-2xl font-bold text-slate-800">
                                    {kpiMetrics.totalPeople}
                                </p>
                                <p className="text-xs text-slate-400 mt-1">across all processes</p>
                            </Card>
                            <Card className="p-4 border-l-4 border-green-500">
                                <h3 className="text-slate-500 text-sm font-medium uppercase">Avg Readiness</h3>
                                <div className="flex items-baseline gap-2">
                                    <p className="text-2xl font-bold text-slate-800">
                                        {kpiMetrics.avgReadiness.toFixed(0)}%
                                    </p>
                                    {weightedView && <span className="text-xs font-bold text-blue-600 bg-blue-50 px-1 rounded">Weighted</span>}
                                </div>
                                <p className="text-xs text-slate-400 mt-1">{weightedView ? "Based on people count" : "Simple average of scores"}</p>
                            </Card>
                        </div>

                        <Card className="p-6">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                                <div className="flex items-center gap-2">
                                    <Calendar className="text-slate-500" size={20} />
                                    <h3 className="text-lg font-bold text-slate-800">Change Heatmap</h3>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-sm text-slate-600">Overlay:</span>
                                    <select 
                                        className="p-1 border border-slate-300 rounded text-sm outline-none focus:ring-1 focus:ring-blue-500"
                                        value={heatmapOverlay}
                                        onChange={(e) => setHeatmapOverlay(e.target.value)}
                                    >
                                        <option value="count">Count of Changes</option>
                                        <option value="changeScore">Avg Change Impact</option>
                                        <option value="readinessScore">Avg Readiness</option>
                                        <option value="capability">Avg Capability (ADKAR)</option>
                                    </select>
                                </div>
                            </div>
                            <p className="text-sm text-slate-500 mb-6">
                                {heatmapOverlay === 'count' && "Visualizing periods of high change activity (count)."}
                                {heatmapOverlay === 'changeScore' && "Visualizing average impact scores (Higher % = More Impact)."}
                                {heatmapOverlay === 'readinessScore' && "Visualizing average readiness scores (Higher % = More Ready)."}
                                {heatmapOverlay === 'capability' && "Visualizing team capability scores on a 1-4 scale (Higher = More Capable)."}
                            </p>
                            
                            <div className="overflow-x-auto">
                                <div className="min-w-[800px]">
                                    <div className="flex border-b border-slate-200 pb-2">
                                        <div className="w-40 font-semibold text-sm text-slate-600 shrink-0">Function</div>
                                        {heatmapData.months.map(m => (
                                            <div key={m} className="flex-1 text-center text-xs font-medium text-slate-500">{m}</div>
                                        ))}
                                    </div>
                                    {Object.keys(heatmapData.grid).map((func) => (
                                        <div key={func} className="flex items-center border-b border-slate-100 py-2 hover:bg-slate-50 transition-colors">
                                            <div className="w-40 text-sm font-medium text-slate-800 shrink-0 truncate pr-2">{func}</div>
                                            {heatmapData.grid[func].map((cell, idx) => {
                                                const { count, changeSum, readinessSum, capabilitySum } = cell;
                                                let valueToDisplay = '-';
                                                let bgClass = "bg-slate-50";
                                                let textClass = "text-slate-300";

                                                if (count > 0) {
                                                    textClass = "text-white";
                                                    
                                                    if (heatmapOverlay === 'count') {
                                                        valueToDisplay = count;
                                                        if (count === 1) bgClass = "bg-blue-200";
                                                        else if (count === 2) bgClass = "bg-blue-400";
                                                        else if (count >= 3) bgClass = "bg-blue-600";
                                                        else if (count >= 5) bgClass = "bg-indigo-800";
                                                    } else if (heatmapOverlay === 'changeScore') {
                                                        const avgChange = changeSum / count;
                                                        valueToDisplay = `${avgChange.toFixed(0)}%`;
                                                        if (avgChange >= 70) bgClass = "bg-red-500";
                                                        else if (avgChange >= 40) bgClass = "bg-amber-400";
                                                        else bgClass = "bg-green-500";
                                                    } else if (heatmapOverlay === 'readinessScore') {
                                                        const avgReady = readinessSum / count;
                                                        valueToDisplay = `${avgReady.toFixed(0)}%`;
                                                        if (avgReady >= 70) bgClass = "bg-green-500";
                                                        else if (avgReady >= 40) bgClass = "bg-amber-400";
                                                        else bgClass = "bg-red-500";
                                                    } else if (heatmapOverlay === 'capability') {
                                                        const avgCap = capabilitySum / count;
                                                        valueToDisplay = avgCap.toFixed(1);
                                                        // 1-4 scale. High is good.
                                                        if (avgCap >= 3) bgClass = "bg-green-500";
                                                        else if (avgCap >= 2) bgClass = "bg-amber-400";
                                                        else bgClass = "bg-red-500";
                                                    }
                                                }

                                                return (
                                                    <div key={idx} className="flex-1 flex justify-center">
                                                        <div 
                                                            className={`w-10 h-8 rounded flex items-center justify-center text-xs font-bold transition-all ${bgClass} ${textClass}`}
                                                            title={`${func} in ${heatmapData.months[idx]}: ${count} changes`}
                                                        >
                                                            {valueToDisplay}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                    {Object.keys(heatmapData.grid).length === 0 && (
                                        <div className="p-8 text-center text-slate-400 italic">No data available for heatmap</div>
                                    )}
                                </div>
                            </div>
                        </Card>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <Card className="p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">Readiness by Function</h3>
                                    <button 
                                        onClick={() => setReadinessSort(prev => prev === 'asc' ? 'desc' : 'asc')}
                                        className="flex items-center text-xs text-slate-500 hover:text-blue-600 gap-1 bg-slate-50 px-2 py-1 rounded border border-slate-200 transition-colors"
                                    >
                                        <ArrowUpDown size={12} />
                                        {readinessSort === 'asc' ? 'Lowest First' : 'Highest First'}
                                    </button>
                                </div>
                                {functionGroups.length === 0 ? <p className="text-slate-400 italic">No data available</p> : (
                                    <div className="space-y-4">
                                        {functionGroups.map((grp, idx) => (
                                            <div key={idx}>
                                                <div className="flex justify-between text-sm mb-1">
                                                    <span className="font-medium">{grp.name}</span>
                                                    <span className="text-slate-500">{grp.avgReadiness.toFixed(1)}%</span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-2.5">
                                                    <div 
                                                        className={`h-2.5 rounded-full ${grp.avgReadiness < 50 ? 'bg-red-500' : grp.avgReadiness < 70 ? 'bg-amber-400' : 'bg-green-500'}`} 
                                                        style={{ width: `${grp.avgReadiness}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </Card>

                            <Card className="p-6">
                                <h3 className="text-lg font-bold text-slate-800 mb-2">Change Risk Matrix (Bubble Chart)</h3>
                                <p className="text-xs text-slate-500 mb-6">Size of bubble = # People Impacted</p>
                                
                                <div className="relative h-64 border-l border-b border-slate-300 bg-slate-50">
                                    <div className="absolute top-2 right-2 text-xs font-bold text-amber-600 bg-amber-50 px-2 rounded">Monitor</div>
                                    <div className="absolute top-2 left-2 text-xs font-bold text-red-600 bg-red-50 px-2 rounded">Critical</div>
                                    <div className="absolute bottom-2 left-2 text-xs font-bold text-amber-600 bg-amber-50 px-2 rounded">Support</div>
                                    <div className="absolute bottom-2 right-2 text-xs font-bold text-green-600 bg-green-50 px-2 rounded">Safe</div>

                                    {filteredItems.map((item, idx) => {
                                        const { changeScore, readinessScore } = calculateScores(item);
                                        const people = parseInt(item.peopleImpacted) || 10;
                                        const size = Math.min(Math.max(people / 5, 12), 48);

                                        return (
                                            <div 
                                                key={idx}
                                                className="absolute rounded-full bg-blue-600/80 border border-blue-700 shadow-sm transform -translate-x-1/2 -translate-y-1/2 hover:scale-110 transition-transform cursor-help flex items-center justify-center group"
                                                style={{ 
                                                    left: `${readinessScore}%`, 
                                                    bottom: `${changeScore}%`,
                                                    width: `${size}px`,
                                                    height: `${size}px`
                                                }}
                                            >
                                                <div className="hidden group-hover:block absolute bottom-full mb-2 w-max px-2 py-1 bg-slate-800 text-white text-xs rounded z-10 pointer-events-none">
                                                    <strong>{item.process}</strong><br/>
                                                    {item.peopleImpacted} people impacted
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                                <div className="flex justify-between mt-2 text-xs text-slate-500">
                                    <span>Low Readiness</span>
                                    <span>High Readiness</span>
                                </div>
                                <div className="absolute -left-8 top-1/2 transform -rotate-90 text-xs text-slate-500">Change Impact Score</div>
                            </Card>
                        </div>
                    </div>
                );
            };

            const GuideView = () => (
                <div className="max-w-4xl mx-auto space-y-8">
                    <Card className="p-8">
                        <h2 className="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <HelpCircle className="text-blue-600" /> 
                            Assessment Criteria Guide
                        </h2>
                        <p className="text-slate-600 mb-8">
                            The following criteria are used to calculate the Change Impact Score and the Readiness Score. 
                            Use this guide to ensure consistency across all process assessments.
                        </p>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {/* Change Score Section */}
                            <div>
                                <h3 className="text-lg font-bold text-blue-900 border-b-2 border-blue-200 pb-2 mb-4">Change Impact Score</h3>
                                <p className="text-xs text-slate-500 mb-4 italic">Formula: (Complexity + Frequency + (2 × Distance)) ÷ 16</p>
                                
                                <div className="space-y-6">
                                    <div>
