                                        <h4 className="font-semibold text-slate-800 mb-2">Process Complexity</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> Highly complex, specialist activity</li>
                                            <li><strong className="text-slate-900">3:</strong> Complex, generalist activity</li>
                                            <li><strong className="text-slate-900">2:</strong> Simple, specialist activity</li>
                                            <li><strong className="text-slate-900">1:</strong> Simple, generalist activity</li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h4 className="font-semibold text-slate-800 mb-2">Process Frequency</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> Constantly</li>
                                            <li><strong className="text-slate-900">3:</strong> Once a day or less</li>
                                            <li><strong className="text-slate-900">2:</strong> Once a week or less</li>
                                            <li><strong className="text-slate-900">1:</strong> Once a month or less</li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h4 className="font-semibold text-slate-800 mb-2">Distance from Current Process (Weighted x2)</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> More than 80% change</li>
                                            <li><strong className="text-slate-900">3:</strong> Less than 50% change</li>
                                            <li><strong className="text-slate-900">2:</strong> Less than 20% change</li>
                                            <li><strong className="text-slate-900">1:</strong> Same or very similar to current</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                            {/* Readiness Score Section */}
                            <div>
                                <h3 className="text-lg font-bold text-green-900 border-b-2 border-green-200 pb-2 mb-4">Readiness Score</h3>
                                <p className="text-xs text-slate-500 mb-4 italic">Formula: (Attitude + Conditions + Resources + Network + Capability) ÷ 20</p>

                                <div className="space-y-6">
                                    <div>
                                        <h4 className="font-semibold text-slate-800 mb-2">Attitude</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> Very positive (Pull rather than Push)</li>
                                            <li><strong className="text-slate-900">3:</strong> Positive by default, needs clarity</li>
                                            <li><strong className="text-slate-900">2:</strong> Resistant by default, can be convinced</li>
                                            <li><strong className="text-slate-900">1:</strong> Resistant to change</li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h4 className="font-semibold text-slate-800 mb-2">Conditions</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> Nothing to divert attention</li>
                                            <li><strong className="text-slate-900">3:</strong> No more than 2 minor changes affecting</li>
                                            <li><strong className="text-slate-900">2:</strong> {'>'} 2 minor or 1 major change affecting</li>
                                            <li><strong className="text-slate-900">1:</strong> Conditions not conducive</li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h4 className="font-semibold text-slate-800 mb-2">Resources (BAU + Change)</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> Fully resourced</li>
                                            <li><strong className="text-slate-900">3:</strong> Sufficient to support change</li>
                                            <li><strong className="text-slate-900">2:</strong> Challenges likely to impact change</li>
                                            <li><strong className="text-slate-900">1:</strong> Challenges prevent implementation</li>
                                        </ul>
                                    </div>
                                    
                                    <div>
                                        <h4 className="font-semibold text-slate-800 mb-2">Change Network</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> Fully resourced and active</li>
                                            <li><strong className="text-slate-900">3:</strong> Agents but not Champions</li>
                                            <li><strong className="text-slate-900">2:</strong> Champions but not Agents</li>
                                            <li><strong className="text-slate-900">1:</strong> Not resourced</li>
                                        </ul>
                                    </div>

                                    {/* Added Capability Section */}
                                    <div>
                                        <h4 className="font-semibold text-slate-800 mb-2">Capability (ADKAR)</h4>
                                        <ul className="text-sm text-slate-600 space-y-1">
                                            <li><strong className="text-slate-900">4:</strong> Confidence in using skills through practice</li>
                                            <li><strong className="text-slate-900">3:</strong> Acquired knowledge/skills (Training)</li>
                                            <li><strong className="text-slate-900">2:</strong> Awareness of new ways working</li>
                                            <li><strong className="text-slate-900">1:</strong> Unaware of new ways of working</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </Card>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-100 text-slate-900 font-sans p-4 md:p-8">
                    <div className="max-w-7xl mx-auto">
                        
                        <header className="mb-8">
                            <h1 className="text-3xl font-bold text-slate-900 flex items-center gap-3">
                                <BarChart2 size={32} className="text-blue-600" />
                                Change Impact Assessment Tool
                            </h1>
                            <p className="text-slate-500 mt-2 text-lg">
                                Stakeholder Analysis & Organizational Impact Calculator
                            </p>
                        </header>

                        <div className="flex gap-4 mb-6 border-b border-slate-200 pb-1 overflow-x-auto">
                            <button 
                                onClick={() => setActiveTab('assessment')}
                                className={`pb-2 px-2 font-medium flex items-center gap-2 transition-colors whitespace-nowrap ${activeTab === 'assessment' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-800'}`}
                            >
                                <FileText size={18} /> Assessments
                            </button>
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`pb-2 px-2 font-medium flex items-center gap-2 transition-colors whitespace-nowrap ${activeTab === 'dashboard' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-800'}`}
                            >
                                <BarChart2 size={18} /> Dashboard & Analysis
                            </button>
                            <button 
                                onClick={() => setActiveTab('guide')}
                                className={`pb-2 px-2 font-medium flex items-center gap-2 transition-colors whitespace-nowrap ${activeTab === 'guide' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-800'}`}
                            >
                                <Info size={18} /> Scoring Guide
                            </button>
                        </div>

                        <main>
                            {activeTab === 'assessment' && <AssessmentView />}
                            {activeTab === 'dashboard' && <DashboardView />}
                            {activeTab === 'guide' && <GuideView />}
                        </main>

                        <footer className="mt-12 text-center text-slate-400 text-sm">
                            Based on IBC Stakeholder Analysis Tool | Data is saved locally in your browser
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChangeImpactApp />);
    </script>
</body>
</html>
