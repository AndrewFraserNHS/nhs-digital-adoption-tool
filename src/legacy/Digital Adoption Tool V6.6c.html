                        });
                    }
                }

                setCurrentDraft(prev => {
                    const compDraft = prev[componentId] || {};
                    const lensDraft = compDraft[lens] || { score: 0, justification: '', evidence: '', actions: [] };
                    
                    let updatedLensDraft = { ...lensDraft };

                    if (field === 'ADD_ACTION') {
                        const actions = updatedLensDraft.actions || [];
                        updatedLensDraft.actions = [...actions, value];
                    } else if (field === 'REMOVE_ACTION') {
                        const actions = updatedLensDraft.actions || [];
                        updatedLensDraft.actions = actions.filter(a => a.id !== value);
                    } else if (field === 'EDIT_ACTION') {
                        const actions = updatedLensDraft.actions || [];
                        updatedLensDraft.actions = actions.map(a => a.id === value.id ? { ...a, ...value } : a);
                    } else if (field === 'UPDATE_ACTION_STATUS') {
                        const actions = updatedLensDraft.actions || [];
                        updatedLensDraft.actions = actions.map(a => a.id === value.id ? { ...a, status: value.status } : a);
                    } else {
                        updatedLensDraft[field] = value;
                    }

                    return {
                        ...prev,
                        [componentId]: {
                            ...compDraft,
                            [lens]: updatedLensDraft
                        }
                    };
                });
            };

            const validateDraftForExport = () => {
                let isValid = true;
                let errorMsgs = [];

                if (!orgProfile.trustName || !orgProfile.projectName) {
                    errorMsgs.push("• Organisation Profile incomplete. Please update settings.");
                    isValid = false;
                }

                Object.keys(currentDraft).forEach(compId => {
                    Object.keys(currentDraft[compId]).forEach(lens => {
                        const entry = currentDraft[compId][lens];
                        if (entry.score > 0 && (!entry.justification || entry.justification.trim() === '')) {
                            isValid = false;
                            const compName = COMPONENTS.find(c => c.id === compId)?.label || compId;
                            errorMsgs.push(`• Missing justification for ${compName} (${lens})`);
                        }
                    });
                });

                if (!isValid) {
                    setModalConfig({
                        isOpen: true,
                        title: 'Validation Failed',
                        message: "You cannot finalise or export until the following are resolved:\n\n" + errorMsgs.slice(0, 5).join("\n") + (errorMsgs.length > 5 ? `\n...and ${errorMsgs.length - 5} more.` : ""),
                        type: 'error'
                    });
                }
                return isValid;
            };

            const exportJSON = () => {
                if (!validateDraftForExport()) return;

                const exportData = {
                    version: "1.0",
                    exportDate: new Date().toISOString(),
                    orgProfile,
                    history,
                    currentDraft
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                const filename = `NHS_Adoption_${orgProfile.trustName.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.json`;
                downloadAnchorNode.setAttribute("download", filename);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                showNotification("Data exported successfully.", "success");
            };

            const triggerImport = () => {
                document.getElementById('import-file').click();
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.orgProfile && parsed.currentDraft) {
                            setOrgProfile(parsed.orgProfile);
                            setHistory(parsed.history || []);
                            setCurrentDraft(parsed.currentDraft);
                            showNotification("Data imported successfully.", "success");
                        } else {
                            throw new Error("Invalid format");
                        }
                    } catch (err) {
                        alert("Error importing file. Please ensure it is a valid NHS Adoption Tool JSON export.");
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // reset
            };

            const finaliseMonth = () => {
                if (!validateDraftForExport()) return;
                
                const monthLabel = new Date().toLocaleString('en-GB', { month: 'short', year: 'numeric' });
                
                // Calculate average score for the month against absolute max possible
                let totalScore = 0;

                Object.keys(currentDraft).forEach(compId => {
                    Object.keys(currentDraft[compId]).forEach(lens => {
                        const score = parseInt(currentDraft[compId][lens].score || 0);
                        if (score > 0) {
                            totalScore += score;
                        }
                    });
                });

                const absoluteMaxPossible = COMPONENTS.reduce((acc, curr) => acc + curr.lenses.length, 0) * 5;
                const overallPercentage = absoluteMaxPossible === 0 ? 0 : Math.round((totalScore / absoluteMaxPossible) * 100);

                const snapshot = {
                    date: new Date().toISOString(),
                    monthLabel,
                    overallPercentage,
                    data: JSON.parse(JSON.stringify(currentDraft)) // Deep copy
                };

                setHistory(prev => [...prev, snapshot]);
                showNotification(`Snapshot for ${monthLabel} saved to history.`, "success");
            };

            const resetApp = () => {
                localStorage.clear();
                window.location.reload();
            };

            if (!isLoaded) return <div className="flex h-screen items-center justify-center">Loading...</div>;

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50 text-slate-800">
                    
                    {/* Sidebar */}
                    <div className="w-72 bg-[#005eb8] text-white flex flex-col shadow-xl z-20">
                        <div className="p-6 border-b border-blue-700">
                            <h1 className="text-xl font-bold tracking-tight">NHS Digital Adoption</h1>
                            <p className="text-blue-200 text-xs mt-1 flex justify-between items-center">
                                <span>Readiness Tracking Tool</span>
                                <span className="opacity-80 font-medium">V6.6</span>
                            </p>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto py-4">
                            <div className="px-4 mb-2 text-xs font-semibold text-blue-300 uppercase tracking-wider">Navigation</div>
                            <nav className="space-y-1 mb-8">
                                <SidebarItem icon="layout-dashboard" label="Dashboard" isActive={view === 'dashboard'} onClick={() => setView('dashboard')} />
                                <SidebarItem icon="list-todo" label="Action Tracker" isActive={view === 'action-plan'} onClick={() => setView('action-plan')} />
                                <SidebarItem icon="settings" label="Settings & Profile" isActive={view === 'settings'} onClick={() => setView('settings')} />
                            </nav>

                            <div className="px-4 mb-2 text-xs font-semibold text-blue-300 uppercase tracking-wider">Assessment Components</div>
                            <nav className="space-y-1">
                                {COMPONENTS.map(comp => {
                                    // Calculate completion and RAG status
                                    const expectedCount = comp.lenses.length;
                                    let scoredCount = 0;
                                    let justifiedCount = 0;
                                    
                                    comp.lenses.forEach(l => {
                                        const entry = currentDraft[comp.id]?.[l];
                                        if (entry && entry.score > 0) {
                                            scoredCount++;
                                            if (entry.justification && entry.justification.trim() !== '') {
                                                justifiedCount++;
                                            }
                                        }
                                    });

                                    let isRed = false;
                                    let isAmber = false;
                                    let isGreen = false;

                                    if (scoredCount > 0) {
                                        if (scoredCount > justifiedCount) {
                                            isRed = true; // Score given, but missing justification
                                        } else if (scoredCount < expectedCount) {
                                            isAmber = true; // Started, but not finished
                                        } else if (scoredCount === expectedCount && justifiedCount === expectedCount) {
                                            isGreen = true; // Finished
                                        }
                                    }

                                    const isActive = view === 'assessment' && activeComponentId === comp.id;
                                    
                                    let statusColorClass = isActive ? 'text-[#005eb8]' : 'text-blue-100';
                                    let iconName = 'circle';
                                    let iconColor = 'opacity-0'; 

                                    if (isRed) {
                                        statusColorClass = isActive ? 'text-red-600' : 'text-red-300';
                                        iconName = 'alert-octagon';
                                        iconColor = isActive ? 'text-red-500' : 'text-red-400';
                                    } else if (isAmber) {
                                        statusColorClass = isActive ? 'text-amber-600' : 'text-amber-300';
                                        iconName = 'alert-circle';
                                        iconColor = isActive ? 'text-amber-500' : 'text-amber-400';
                                    } else if (isGreen) {
                                        statusColorClass = isActive ? 'text-green-600' : 'text-green-300';
                                        iconName = 'check-circle';
                                        iconColor = isActive ? 'text-green-500' : 'text-green-400';
                                    }

                                    return (
                                        <button 
                                            key={comp.id}
                                            onClick={() => { setView('assessment'); setActiveComponentId(comp.id); }}
                                            className={`w-full text-left px-4 py-2 text-sm flex items-center justify-between transition-colors
                                                ${isActive ? 'bg-white font-medium' : 'hover:bg-blue-800'}
                                                ${statusColorClass}
                                            `}
                                        >
                                            <span className="truncate pr-2">{comp.label}</span>
                                            {scoredCount > 0 && <Icon name={iconName} className={`w-4 h-4 flex-shrink-0 ${iconColor}`} />}
                                        </button>
                                    );
                                })}
                            </nav>
                            
                            {/* RAG Status Legend */}
                            <div className="mt-8 px-4 pb-4 border-t border-blue-800 pt-6">
                                <div className="text-[10px] font-semibold text-blue-300 uppercase tracking-wider mb-3">Status Legend</div>
                                <div className="space-y-2 text-xs text-blue-200">
                                    <div className="flex items-center"><Icon name="circle" className="w-3 h-3 mr-2 opacity-50" /> Not Started</div>
                                    <div className="flex items-center"><Icon name="alert-circle" className="w-3 h-3 mr-2 text-amber-400" /> In Progress</div>
                                    <div className="flex items-center"><Icon name="alert-octagon" className="w-3 h-3 mr-2 text-red-400" /> Missing Justification</div>
                                    <div className="flex items-center"><Icon name="check-circle" className="w-3 h-3 mr-2 text-green-400" /> Completed</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        
                        {/* Top Navbar */}
                        <header className="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-10 shadow-sm">
                            <div className="flex items-center text-sm">
                                <span className="font-semibold text-slate-700 mr-2">{orgProfile.trustName || "Unconfigured Trust"}</span>
                                <span className="text-slate-400">/</span>
                                <span className="text-slate-600 ml-2">{orgProfile.projectName || "Unnamed Project"}</span>
                                <button onClick={() => setShowInfoModal(true)} className="ml-3 text-slate-400 hover:text-[#005eb8] transition-colors" title="Version History & Info">
                                    <Icon name="info" className="w-5 h-5" />
                                </button>
                            </div>
                            
                            <div className="flex items-center space-x-3">
                                <input type="file" id="import-file" accept=".json" className="hidden" onChange={handleImport} />
                                <button onClick={triggerImport} className="text-sm px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-md font-medium transition-colors flex items-center">
                                    <Icon name="upload" className="w-4 h-4 mr-2" /> Import
                                </button>
                                <button onClick={exportJSON} className="text-sm px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-md font-medium transition-colors flex items-center">
                                    <Icon name="download" className="w-4 h-4 mr-2" /> Export JSON
                                </button>
                                <button onClick={finaliseMonth} className="text-sm px-4 py-2 bg-[#005eb8] text-white hover:bg-blue-700 rounded-md font-medium shadow-sm transition-colors flex items-center">
                                    <Icon name="save" className="w-4 h-4 mr-2" /> Finalise Month
                                </button>
                            </div>
                        </header>

                        {/* Notification Toast */}
                        {notification && (
                            <div className={`absolute top-20 right-6 p-4 rounded-md shadow-lg border-l-4 transition-all z-50 animate-fade-in
                                ${notification.type === 'error' ? 'bg-red-50 border-red-500 text-red-800' : 'bg-green-50 border-green-500 text-green-800'}
                            `}>
                                <div className="flex items-center">
                                    <Icon name={notification.type === 'error' ? 'alert-triangle' : 'check'} className="w-5 h-5 mr-2" />
                                    {notification.message}
                                </div>
                            </div>
                        )}

                        {/* Dynamic View Injection */}
                        <main className="flex-1 overflow-y-auto p-8 relative">
                            {view === 'dashboard' && <DashboardView history={history} currentDraft={currentDraft} onNavigateToComponent={(compId) => { setView('assessment'); setActiveComponentId(compId); }} />}
                            {view === 'assessment' && <AssessmentView 
                                component={COMPONENTS.find(c => c.id === activeComponentId)} 
                                currentDraft={currentDraft}
                                handleDraftUpdate={handleDraftUpdate}
                            />}
                            {view === 'action-plan' && <ActionTrackerView currentDraft={currentDraft} handleDraftUpdate={handleDraftUpdate} />}
                            {view === 'settings' && <SettingsView orgProfile={orgProfile} setOrgProfile={setOrgProfile} onReset={() => setModalConfig({ isOpen: true, title: 'Confirm Reset', message: 'Are you absolutely sure you want to clear all data and reset the tool? This action cannot be undone.', type: 'reset' })} />}
                        </main>
                    </div>

                    {/* Modal Overlay */}
                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm animate-fade-in">
                            <div className={`bg-white rounded-lg shadow-xl max-w-md w-full p-6 border-t-4 ${modalConfig.type === 'error' ? 'border-red-500' : (modalConfig.type === 'reset' ? 'border-red-600' : 'border-amber-500')}`}>
                                <h3 className="text-lg font-bold text-slate-800 mb-2 flex items-center">
                                    <Icon name={modalConfig.type === 'error' ? 'alert-octagon' : 'alert-triangle'} className={`w-5 h-5 mr-2 ${modalConfig.type === 'error' || modalConfig.type === 'reset' ? 'text-red-500' : 'text-amber-500'}`} />
                                    {modalConfig.title}
                                </h3>
                                <p className="text-sm text-slate-600 mb-6 whitespace-pre-wrap leading-relaxed">{modalConfig.message}</p>
                                <div className="flex justify-end gap-2">
                                    {modalConfig.type === 'reset' && (
                                        <button 
                                            onClick={() => setModalConfig({ ...modalConfig, isOpen: false })}
                                            className="px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-md hover:bg-slate-200 transition-colors shadow-sm"
                                        >
                                            Cancel
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => {
                                            if (modalConfig.type === 'reset') resetApp();
                                            else setModalConfig({ ...modalConfig, isOpen: false });
                                        }}
                                        className={`px-4 py-2 text-white text-sm font-medium rounded-md transition-colors shadow-sm ${modalConfig.type === 'reset' ? 'bg-red-600 hover:bg-red-700' : 'bg-[#005eb8] hover:bg-blue-700'}`}
                                    >
                                        {modalConfig.type === 'reset' ? 'Confirm Reset' : 'Acknowledge'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Version History Info Modal */}
                    {showInfoModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 border-t-4 border-[#005eb8]">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                    <Icon name="info" className="w-5 h-5 mr-2 text-[#005eb8]" />
                                    Version History & Release Notes
                                </h3>
                                <div className="space-y-6 max-h-96 overflow-y-auto pr-2 text-sm text-slate-600">
                                    <div>
                                        <h4 className="font-bold text-slate-800 text-base">Version 6.6 (Current)</h4>
                                        <ul className="list-disc pl-5 mt-2 space-y-1.5">
                                            <li><strong>Assessment Matrix:</strong> Added a "View Full Matrix" toggle to display all 5 levels of guidance side-by-side, plus a dedicated "Not Started" box.</li>
                                            <li><strong>Target Scores:</strong> Updated the target Go-Live readiness scores for several components to better reflect programme requirements.</li>
                                            <li><strong>Reset Functionality:</strong> Added a "Reset Application" button in the Settings menu to clear all local data.</li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 text-base">Version 6.5</h4>
                                        <ul className="list-disc pl-5 mt-2 space-y-1.5">
                                            <li><strong>Dashboard Analytics:</strong> Added a new "Overall Average by Component" grid and increased the size of the Radar and Trajectory charts.</li>
                                            <li><strong>Quick Navigation:</strong> Added inline edit buttons on the Dashboard to instantly jump to specific component assessments.</li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 text-base">Version 6.1</h4>
                                        <ul className="list-disc pl-5 mt-2 space-y-1.5">
                                            <li>Introduced localized inline editing functionality across the Action Management architecture.</li>
                                            <li>Users can now directly edit Action descriptions, Owners, and Timescales within the Assessment view cards.</li>
                                            <li>Users can now transition rows in the Consolidated Action Tracker into an "Edit Mode" to modify action details on the fly.</li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 text-base">Version 6.0</h4>
                                        <ul className="list-disc pl-5 mt-2 space-y-1.5">
                                            <li>Updated terminology to use "Readiness" instead of "Maturity" throughout the application.</li>
                                            <li>Transitioned from legacy multi-tabbed Excel spreadsheet to a single-file digital web application.</li>
                                            <li>Implemented guided, context-aware scoring workflow to reduce cognitive load during assessments.</li>
                                            <li>Integrated the Component Matrix directly into the scoring interface for immediate reference.</li>
                                            <li>Added a continuous history ledger allowing longitudinal tracking of adoption readiness.</li>
                                            <li>Introduced visual Radar Chart for real-time diagnostic view of the 17 component spreads.</li>
                                            <li>Added dynamic RAG (Red, Amber, Green) status indicators to track assessment completion and mandatory justifications.</li>
                                            <li>Separated scoring phases visually to highlight the 85% pre go-live readiness threshold.</li>
                                            <li>Refactored Action Tracker to allow multiple distinct, strictly mandated Gap Bridging Actions per component lens.</li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-800">Prior Versions (Legacy Spreadsheet)</h4>
                                        <ul className="list-disc pl-5 mt-2 space-y-1.5 opacity-80">
                                            <li>v4.0: Updated component structure and revised guidance criteria.</li>
                                            <li>v1.0 - 3.0: Iterative refinements to the baseline assessment matrices.</li>
                                        </ul>
                                    </div>
                                </div>
                                <div className="flex justify-end mt-6 pt-4 border-t border-slate-100">
                                    <button 
                                        onClick={() => setShowInfoModal(false)}
                                        className="px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-md hover:bg-slate-200 transition-colors shadow-sm"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Sub-Components ---

        const SidebarItem = ({ icon, label, isActive, onClick }) => (
            <button 
                onClick={onClick}
                className={`w-full flex items-center px-4 py-2.5 text-sm transition-colors ${isActive ? 'bg-blue-800 text-white font-medium border-l-4 border-white' : 'text-blue-100 hover:bg-blue-800 border-l-4 border-transparent'}`}
            >
                <Icon name={icon} className="w-5 h-5 mr-3 opacity-80" />
                {label}
            </button>
        );

        // 1. Dashboard View
        const DashboardView = ({ history, currentDraft, onNavigateToComponent }) => {
            const lineChartRef = useRef(null);
            const lineChartInstance = useRef(null);
            const radarChartRef = useRef(null);
            const radarChartInstance = useRef(null);
            
            // Calculate Current Metrics
            const metrics = useMemo(() => {
                let total = 0, count = 0;
                
                Object.keys(currentDraft).forEach(compId => {
                    Object.keys(currentDraft[compId]).forEach(lens => {
                        const score = parseInt(currentDraft[compId][lens].score || 0);
                        if(score > 0) {
                            total += score;
                            count++;
                        }
                    });
                });

                const maxPossible = COMPONENTS.reduce((acc, curr) => acc + curr.lenses.length, 0) * 5;
                
                return {
                    overallPct: maxPossible ? Math.round((total / maxPossible) * 100) : 0,
                    assessedCount: count,
                    totalExpected: COMPONENTS.reduce((acc, curr) => acc + curr.lenses.length, 0)
                };
            }, [currentDraft]);

            // Calculate Radar Chart Data (Current Component Spread)
            const radarData = useMemo(() => {
                const labels = LENSES;
                const currentData = LENSES.map(lens => {
                    let totalScore = 0;
                    let count = 0;
                    COMPONENTS.forEach(comp => {
                        if (comp.lenses.includes(lens)) {
                            const score = parseInt(currentDraft[comp.id]?.[lens]?.score || 0);
                            if (score > 0) {
                                totalScore += score;
                                count++;
                            }
                        }
                    });
                    return count === 0 ? 0 : totalScore / count;
                });

                const targetData = LENSES.map(lens => {
                    let totalTarget = 0;
                    let count = 0;
                    COMPONENTS.forEach(comp => {
                        if (comp.lenses.includes(lens)) {
                            totalTarget += comp.target;
                            count++;
                        }
                    });
                    return count === 0 ? 0 : totalTarget / count;
                });

                return { labels, currentData, targetData };
            }, [currentDraft]);

            useEffect(() => {
                if (lineChartRef.current && history.length > 0) {
                    if (lineChartInstance.current) lineChartInstance.current.destroy();
                    
                    const ctx = lineChartRef.current.getContext('2d');
                    lineChartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: history.map(h => h.monthLabel),
                            datasets: [{
                                label: 'Overall Readiness %',
                                data: history.map(h => h.overallPercentage),
                                borderColor: '#005eb8',
                                backgroundColor: 'rgba(0, 94, 184, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3,
                                pointBackgroundColor: '#005eb8',
                                pointRadius: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } }
                        }
                    });
                }
                
                return () => {
                    if (lineChartInstance.current) lineChartInstance.current.destroy();
                }
            }, [history]);

            // Radar Chart Effect
            useEffect(() => {
                if (radarChartRef.current) {
                    if (radarChartInstance.current) radarChartInstance.current.destroy();
                    
                    const ctx = radarChartRef.current.getContext('2d');
                    radarChartInstance.current = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: radarData.labels,
                            datasets: [
                                {
                                    label: 'Current Average Readiness',
                                    data: radarData.currentData,
                                    backgroundColor: 'rgba(0, 94, 184, 0.2)',
                                    borderColor: '#005eb8',
                                    pointBackgroundColor: '#005eb8',
                                    pointBorderColor: '#fff',
                                    pointHoverBackgroundColor: '#fff',
                                    pointHoverBorderColor: '#005eb8',
                                    borderWidth: 2,
                                },
                                {
                                    label: 'Pre-Live Target Average',
                                    data: radarData.targetData,
                                    backgroundColor: 'rgba(148, 163, 184, 0.1)',
                                    borderColor: '#94a3b8',
                                    borderDash: [5, 5],
                                    pointBackgroundColor: '#94a3b8',
                                    pointBorderColor: '#fff',
                                    pointHoverBackgroundColor: '#fff',
                                    pointHoverBorderColor: '#94a3b8',
                                    borderWidth: 2,
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    angleLines: { color: 'rgba(0,0,0,0.05)' },
                                    grid: { color: 'rgba(0,0,0,0.05)' },
                                    pointLabels: {
                                        font: { size: 10, family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" },
                                        color: '#475569'
                                    },
                                    ticks: { min: 0, max: 5, stepSize: 1, display: true, color: '#94a3b8', backdropColor: 'transparent' }
                                }
                            },
                            plugins: {
                                legend: { display: true, position: 'bottom' },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            return ` ${context.dataset.label}: ${context.raw.toFixed(1)} / 5`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
                
                return () => {
                    if (radarChartInstance.current) radarChartInstance.current.destroy();
                }
            }, [radarData]);

            return (
                <div className="max-w-6xl mx-auto animate-fade-in">
                    <h2 className="text-2xl font-bold text-slate-800 mb-6">Adoption Readiness Dashboard</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {/* KPI 1 */}
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-slate-200">
                            <h3 className="text-sm font-medium text-slate-500 mb-1">Overall Adoption Readiness</h3>
                            <div className="flex items-end space-x-2">
                                <span className="text-4xl font-bold text-[#005eb8]">{metrics.overallPct}%</span>
                            </div>
                            
                            <div className="mt-4 w-full bg-slate-100 rounded-full h-3 relative overflow-hidden">
                                <div className="absolute top-0 left-0 h-full bg-[#005eb8]" style={{ width: `${metrics.overallPct}%` }}></div>
                            </div>
                            <div className="flex justify-between text-xs text-slate-400 mt-2">
                                <span>Progress towards maximum possible score across all areas.</span>
                            </div>
                        </div>

                        {/* KPI 2 */}
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-slate-200">
                            <h3 className="text-sm font-medium text-slate-500 mb-1">Assessment Progress</h3>
                            <div className="flex items-end space-x-2">
                                <span className="text-4xl font-bold text-slate-700">{metrics.assessedCount}</span>
                                <span className="text-lg text-slate-400 mb-1">/ {metrics.totalExpected}</span>
                            </div>
                            <p className="text-sm text-slate-500 mt-2">Component lenses assessed this month.</p>
                        </div>

                        {/* KPI 3 */}
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-slate-200">
                            <h3 className="text-sm font-medium text-slate-500 mb-1">Historical Snapshots</h3>
                            <div className="flex items-end space-x-2">
                                <span className="text-4xl font-bold text-slate-700">{history.length}</span>
                            </div>
                            <p className="text-sm text-slate-500 mt-2">Months of tracked data available.</p>
                        </div>
                    </div>

                    {/* Charts Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        {/* Trajectory Chart Area */}
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-slate-200 flex flex-col">
                            <h3 className="text-lg font-semibold text-slate-800 mb-4">Readiness Trajectory</h3>
                            <div className="flex-1 min-h-[400px] flex items-center justify-center bg-slate-50 rounded border border-slate-100 p-2">
                                {history.length > 0 ? (
                                    <canvas ref={lineChartRef}></canvas>
                                ) : (
                                    <div className="text-center text-slate-400">
                                        <Icon name="trending-up" className="w-12 h-12 mx-auto mb-2 opacity-50" />
                                        <p>No historical data yet. Finalise your first month to generate trends.</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Radar Chart Area */}
                        <div className="bg-white rounded-lg shadow-sm p-6 border border-slate-200 flex flex-col">
                            <h3 className="text-lg font-semibold text-slate-800 mb-4">Strategic Lenses Spread</h3>
                            <div className="flex-1 min-h-[400px] flex items-center justify-center bg-slate-50 rounded border border-slate-100 p-2">
                                <canvas ref={radarChartRef}></canvas>
                            </div>
                            <p className="text-xs text-center text-slate-500 mt-4">Visualises your current draft readiness score averaged across the 5 strategic lenses against their specific target requirements.</p>
                        </div>
                    </div>

                    {/* Component Readiness Averages */}
                    <div className="bg-white rounded-lg shadow-sm p-6 border border-slate-200 mb-8">
                        <h3 className="text-lg font-semibold text-slate-800 mb-4">Overall Average by Component</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            {COMPONENTS.map(comp => {
                                let compTotal = 0;
                                comp.lenses.forEach(lens => {
                                    const s = parseInt(currentDraft[comp.id]?.[lens]?.score || 0);
                                    if (s > 0) compTotal += s;
                                });
                                const trueAvg = (compTotal / comp.lenses.length).toFixed(1);
                                const avgNum = parseFloat(trueAvg);
                                const isAtTarget = avgNum >= comp.target;

                                return (
                                    <div key={comp.id} onClick={() => onNavigateToComponent(comp.id)} className="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-md hover:border-blue-300 transition-colors group cursor-pointer">
                                        <span className="text-sm font-medium text-slate-700 truncate pr-2 group-hover:text-[#005eb8]" title={comp.label}>{comp.label}</span>
                                        <div className="flex items-center space-x-2">
                                            <span className={`text-xs font-bold px-2 py-1 rounded ${avgNum === 0 ? 'bg-slate-200 text-slate-500' : (isAtTarget ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700')}`}>
                                                {avgNum > 0 ? trueAvg : '-'}
                                            </span>
                                            <button className="text-slate-400 hover:text-[#005eb8] p-1 opacity-0 group-hover:opacity-100 transition-opacity" title="Edit Component">
                                                <Icon name="pencil" className="w-3 h-3" />
                                            </button>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* Lens & Component Breakdown */}
                    <div className="bg-white rounded-lg shadow-sm p-6 border border-slate-200 mb-8">
                        <h3 className="text-lg font-semibold text-slate-800 mb-4">Lens & Component Breakdown</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {LENSES.map((lens, idx) => {
                                const mappedComps = COMPONENTS.filter(c => c.lenses.includes(lens));
                                return (
                                    <div key={idx} className="border border-slate-100 rounded-md p-4 bg-slate-50">
                                        <h4 className="font-bold text-sm text-[#005eb8] mb-3">{lens}</h4>
                                        <ul className="space-y-2">
                                            {mappedComps.map(comp => {
                                                const score = parseInt(currentDraft[comp.id]?.[lens]?.score || 0);
                                                const isAtTarget = score >= comp.target;
                                                return (
                                                    <li key={comp.id} className="text-xs flex justify-between items-center bg-white p-2 rounded border border-slate-100 group">
                                                        <span className="truncate pr-2 font-medium text-slate-700">{comp.label}</span>
                                                        <div className="flex items-center space-x-1">
                                                            <span className={`px-2 py-0.5 rounded font-bold ${score === 0 ? 'bg-slate-100 text-slate-400' : (isAtTarget ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700')}`}>
                                                                {score === 0 ? '-' : `L${score}`}
                                                            </span>
                                                            <button 
                                                                onClick={() => onNavigateToComponent(comp.id)}
                                                                className="text-slate-400 hover:text-[#005eb8] p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                                                                title="Edit Component"
                                                            >
                                                                <Icon name="pencil" className="w-3 h-3" />
                                                            </button>
                                                        </div>
                                                    </li>
                                                )
                                            })}
                                        </ul>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Assessment Core View
        const AssessmentView = ({ component, currentDraft, handleDraftUpdate }) => {
            const [activeLensInfo, setActiveLensInfo] = useState(null);
            const [showMatrix, setShowMatrix] = useState({});

            const toggleMatrix = (lens) => {
                setShowMatrix(prev => ({ ...prev, [lens]: !prev[lens] }));
            };

            const getRubricText = (compId, lensName, score) => {
                if (SPECIFIC_RUBRICS[compId] && SPECIFIC_RUBRICS[compId][lensName] && SPECIFIC_RUBRICS[compId][lensName][score]) {
                    return SPECIFIC_RUBRICS[compId][lensName][score];
                }
                return RUBRIC[score] || "Activity has not yet commenced or been defined.";
            };

            return (
                <div className="max-w-5xl mx-auto animate-fade-in pb-20">
                    <div className="mb-8 flex items-center justify-between">
                        <div>
                            <h2 className="text-3xl font-bold text-slate-800 flex items-center">
                                {component.label}
                                <span className="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded ml-4 border border-blue-200">
                                    Toolkit Phase {component.phase}
                                </span>
                            </h2>
                            <p className="text-slate-500 mt-2">Score the current readiness of this component. The target score prior to Go-Live is Level {component.target}.</p>
                        </div>
                    </div>

                    <div className="space-y-8">
                        {component.lenses.map((lens, idx) => {
                            const entry = (currentDraft[component.id] && currentDraft[component.id][lens]) || { score: 0, justification: '', evidence: '', actions: [] };
                            
                            return (
                                <div key={idx} className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                                    {/* Lens Header & Scoring */}
                                    <div className="bg-slate-50 p-6 border-b border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <span className="text-xs font-bold uppercase tracking-wider text-blue-600 block mb-1">Lens</span>
                                            <button 
                                                onClick={() => setActiveLensInfo(lens)}
                                                className="flex items-center text-xl font-semibold text-slate-800 hover:text-[#005eb8] transition-colors group text-left"
                                                title="View Lens Information"
                                            >
                                                {lens}
                                                <Icon name="info" className="w-5 h-5 ml-2 text-slate-400 group-hover:text-[#005eb8] flex-shrink-0" />
                                            </button>
                                        </div>
                                        
                                        <div className="shrink-0 w-full md:w-64">
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">Readiness Score</label>
                                            <select 
                                                value={entry.score}
                                                onChange={(e) => handleDraftUpdate(component.id, lens, 'score', parseInt(e.target.value))}
                                                className="w-full border-slate-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-white py-2 px-3 text-sm font-medium"
                                                style={{ borderLeftWidth: '4px', borderLeftColor: entry.score >= component.target ? '#22c55e' : (entry.score > 0 ? '#f59e0b' : '#cbd5e1') }}
                                            >
                                                <option value={0}>0 - Not Started</option>
                                                <option value={1}>1 - Emerging</option>
                                                <option value={2}>2 - Developing</option>
                                                <option value={3}>3 - Embedding</option>
                                                <option value={4}>4 - Adopted</option>
                                                <option value={5}>5 - Thriving</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Rubric Display */}
                                    <div className="px-6 py-4 bg-blue-50/50 border-b border-slate-100 text-sm">
                                        <div className="flex flex-col sm:flex-row justify-between items-start gap-4">
                                            <div className="flex items-start flex-1">
                                                <Icon name="info" className="w-4 h-4 text-blue-500 mt-0.5 mr-2 shrink-0" />
                                                <p className="text-slate-600 whitespace-pre-line">
                                                    <strong className="text-slate-700">{entry.score === 0 ? 'Not Started' : `Level ${entry.score}`}: </strong> 
                                                    {getRubricText(component.id, lens, entry.score)}
                                                </p>
                                            </div>
                                            <button 
                                                onClick={() => toggleMatrix(lens)} 
                                                className="shrink-0 text-xs font-semibold text-[#005eb8] hover:text-blue-800 flex items-center bg-white px-3 py-1.5 border border-blue-200 rounded shadow-sm transition-colors"
                                            >
                                                <Icon name={showMatrix[lens] ? "eye-off" : "eye"} className="w-4 h-4 mr-1.5" />
                                                {showMatrix[lens] ? "Hide Matrix Guidance" : "View Full Matrix"}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Full Matrix Grid (Expanded) */}
                                    {showMatrix[lens] && (
                                        <div className="px-6 py-5 bg-slate-50 border-b border-slate-200">
                                            <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 flex items-center">
                                                <Icon name="list" className="w-4 h-4 mr-2 text-slate-400" /> Matrix Criteria Guidance
                                            </h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                                                {[0, 1, 2, 3, 4, 5].map(level => {
                                                    const bgColors = {
                                                        0: 'bg-white',
                                                        1: 'bg-rose-50',
                                                        2: 'bg-orange-50',
                                                        3: 'bg-yellow-50',
                                                        4: 'bg-green-50',
                                                        5: 'bg-blue-50'
                                                    };
                                                    const baseBg = bgColors[level];
                                                    
                                                    return (
                                                        <div 
                                                            key={level} 
                                                            className={`p-4 rounded-lg border shadow-sm transition-colors cursor-pointer
                                                                ${entry.score === level ? `${baseBg} border-[#005eb8] ring-1 ring-[#005eb8]` : `${baseBg} border-slate-200 hover:border-blue-300`}
                                                            `}
                                                            onClick={() => handleDraftUpdate(component.id, lens, 'score', level)}
                                                        >
                                                            <div className={`text-sm font-bold mb-2 pb-2 border-b ${entry.score === level ? 'text-[#005eb8] border-blue-200' : 'text-slate-700 border-slate-100'}`}>
                                                                {level === 0 ? 'Not Started' : `Level ${level}`}
                                                            </div>
                                                            <p className="text-xs text-slate-600 whitespace-pre-line leading-relaxed">
                                                                {getRubricText(component.id, lens, level)}
                                                            </p>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* Form Fields */}
                                    <div className="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        
                                        {/* Qualitative Data */}
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">
                                                    Justification <span className="text-red-500">*</span>
                                                </label>
                                                <textarea 
                                                    value={entry.justification}
                                                    onChange={(e) => handleDraftUpdate(component.id, lens, 'justification', e.target.value)}
                                                    className="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm h-24 p-2 border"
                                                    placeholder="Why did you select this readiness level? Reference the matrix criteria."
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Evidence Links / Docs</label>
                                                <textarea 
                                                    value={entry.evidence}
                                                    onChange={(e) => handleDraftUpdate(component.id, lens, 'evidence', e.target.value)}
                                                    className="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm h-16 p-2 border"
                                                    placeholder="e.g. SharePoint links, Board Minute references."
                                                />
                                            </div>
                                        </div>

                                        {/* 1:Many Action Planning */}
                                        <LensActionManager 
                                            actions={entry.actions || []} 
                                            onAdd={(action) => handleDraftUpdate(component.id, lens, 'ADD_ACTION', action)}
                                            onRemove={(id) => handleDraftUpdate(component.id, lens, 'REMOVE_ACTION', id)}
                                            onEdit={(action) => handleDraftUpdate(component.id, lens, 'EDIT_ACTION', action)}
                                        />

                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Lens Info Modal */}
                    {activeLensInfo && LENS_INFO[activeLensInfo] && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm animate-fade-in p-4">
                            <div className="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 border-t-4 border-[#005eb8]">
                                <div className="flex justify-between items-start mb-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center">
                                        <Icon name="info" className="w-5 h-5 mr-2 text-[#005eb8]" />
                                        {activeLensInfo}
                                    </h3>
                                </div>
                                <div className="space-y-4 text-sm text-slate-600">
                                    <div>
                                        <h4 className="font-bold text-slate-800">Outcome</h4>
                                        <p className="mt-1 leading-relaxed">{LENS_INFO[activeLensInfo].outcome}</p>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-800">What Good Looks Like</h4>
                                        <p className="mt-1 leading-relaxed">{LENS_INFO[activeLensInfo].whatGoodLooksLike}</p>
                                    </div>
                                </div>
                                <div className="flex justify-end mt-6 pt-4 border-t border-slate-100">
                                    <button 
                                        onClick={() => setActiveLensInfo(null)}
                                        className="px-4 py-2 bg-[#005eb8] text-white text-sm font-medium rounded-md hover:bg-blue-700 transition-colors shadow-sm"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 3. Action Tracker View
        const ActionTrackerView = ({ currentDraft, handleDraftUpdate }) => {
            const [editingId, setEditingId] = useState(null);
            const [editDraft, setEditDraft] = useState({});
            
            // Flatten draft into an array of actions
            const allActions = useMemo(() => {
                let list = [];
                Object.keys(currentDraft).forEach(compId => {
                    const compName = COMPONENTS.find(c => c.id === compId)?.label || compId;
                    Object.keys(currentDraft[compId]).forEach(lens => {
                        const entry = currentDraft[compId][lens];
                        if (entry.actions && entry.actions.length > 0) {
                            entry.actions.forEach(act => {
                                list.push({
                                    compId, 
                                    compName, 
                                    lens, 
                                    actionId: act.id,
                                    action: act.text,
                                    owner: act.owner,
                                    timescale: act.timescale,
                                    actionStatus: act.status
                                });
                            });
                        }
                    });
                });
                return list;
            }, [currentDraft]);

            const isOverdue = (dateString, status) => {
                if (!dateString || status === 'Completed') return false;
                const targetDate = new Date(dateString);
                if (isNaN(targetDate)) return false; 
                const today = new Date();
                targetDate.setHours(0,0,0,0);
                today.setHours(0,0,0,0);
                return targetDate < today;
            };

            const startTrackerEdit = (act) => {
                setEditingId(act.actionId);
                setEditDraft({ ...act });
            };

            const saveTrackerEdit = (act) => {
                if (!editDraft.action.trim() || !editDraft.owner.trim() || !editDraft.timescale) {
                    alert('Action Required, Owner, and Timescale fields are strictly required.');
                    return;
                }
                handleDraftUpdate(act.compId, act.lens, 'EDIT_ACTION', {
                    id: act.actionId,
                    text: editDraft.action,
                    owner: editDraft.owner,
                    timescale: editDraft.timescale,
                    status: editDraft.actionStatus
                });
                setEditingId(null);
            };

            const cancelTrackerEdit = () => {
                setEditingId(null);
                setEditDraft({});
            };

            return (
                <div className="max-w-6xl mx-auto animate-fade-in">
                    <div className="mb-6 flex justify-between items-end">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Consolidated Action Tracker</h2>
                            <p className="text-slate-500 mt-1">Manage interventions required to bridge readiness gaps.</p>
                        </div>
                        <div className="text-sm font-medium text-slate-500">
                            Total Actions: {allActions.length}
                        </div>
                    </div>

                    {allActions.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-lg border border-slate-200 border-dashed">
                            <Icon name="check-circle" className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                            <h3 className="text-lg font-medium text-slate-700">No actions defined</h3>
                            <p className="text-slate-500 mt-1">Actions added within component assessments will appear here.</p>
                        </div>
                    ) : (
                        <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-slate-50">
                                    <tr>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Source Area</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Action Required</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Owner</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Timescale</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-slate-200">
                                    {allActions.map((act, idx) => {
                                        if (editingId === act.actionId) {
                                            return (
                                                <tr key={idx} className="bg-blue-50/50">
                                                    <td className="px-6 py-4 text-sm">
                                                        <div className="font-medium text-slate-900">{act.compName}</div>
                                                        <div className="text-slate-500 text-xs">{act.lens}</div>
                                                    </td>
                                                    <td className="px-6 py-4 text-sm text-slate-700">
                                                        <textarea 
                                                            value={editDraft.action} 
                                                            onChange={e => setEditDraft({...editDraft, action: e.target.value})} 
                                                            className="w-full rounded border-slate-300 shadow-sm text-sm p-1 border" 
                                                        />
                                                    </td>
                                                    <td className="px-6 py-4 text-sm text-slate-500">
                                                        <input 
                                                            type="text" 
                                                            value={editDraft.owner} 
                                                            onChange={e => setEditDraft({...editDraft, owner: e.target.value})} 
                                                            className="w-full rounded border-slate-300 shadow-sm text-sm p-1 border" 
                                                        />
                                                    </td>
                                                    <td className="px-6 py-4 text-sm text-slate-500">
                                                        <input 
                                                            type="date" 
                                                            value={editDraft.timescale} 
                                                            onChange={e => setEditDraft({...editDraft, timescale: e.target.value})} 
                                                            className="w-full rounded border-slate-300 shadow-sm text-sm p-1 border text-slate-600" 
                                                        />
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <select 
                                                            value={editDraft.actionStatus} 
                                                            onChange={e => setEditDraft({...editDraft, actionStatus: e.target.value})} 
                                                            className="w-full rounded border-slate-300 shadow-sm text-sm p-1 border bg-white mb-2"
                                                        >
                                                            <option>Not Started</option>
                                                            <option>In Progress</option>
                                                            <option>Blocked</option>
                                                            <option>Completed</option>
                                                        </select>
                                                        <div className="flex justify-end space-x-2 mt-1">
                                                            <button onClick={cancelTrackerEdit} className="text-xs px-2 py-1 rounded text-slate-600 hover:bg-slate-100 font-medium">Cancel</button>
                                                            <button onClick={() => saveTrackerEdit(act)} className="text-xs px-2 py-1 rounded bg-blue-600 text-white font-bold hover:bg-blue-700">Save</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        }

                                        return (
                                            <tr key={idx} className="hover:bg-slate-50 transition-colors group">
                                                <td className="px-6 py-4 text-sm">
                                                    <div className="font-medium text-slate-900">{act.compName}</div>
                                                    <div className="text-slate-500 text-xs">{act.lens}</div>
                                                </td>
                                                <td className="px-6 py-4 text-sm text-slate-700 max-w-md truncate" title={act.action}>
                                                    {act.action}
                                                </td>
                                                <td className="px-6 py-4 text-sm text-slate-500">{act.owner || '-'}</td>
                                                <td className="px-6 py-4 text-sm text-slate-500 whitespace-nowrap flex flex-col">
                                                    <span>{act.timescale ? new Date(act.timescale).toLocaleDateString('en-GB') : '-'}</span>
                                                    {isOverdue(act.timescale, act.actionStatus) && (
                                                        <span className="text-[10px] text-red-600 font-bold bg-red-100 px-1.5 py-0.5 rounded flex items-center w-max mt-1">
                                                            <Icon name="alert-circle" className="w-3 h-3 mr-1" /> Overdue
                                                        </span>
                                                    )}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <div className="flex items-center space-x-2">
                                                        <select 
                                                            value={act.actionStatus}
                                                            onChange={(e) => handleDraftUpdate(act.compId, act.lens, 'UPDATE_ACTION_STATUS', { id: act.actionId, status: e.target.value })}
                                                            className={`text-xs rounded-full px-3 py-1 font-semibold border-0 cursor-pointer outline-none ring-1 ring-inset
                                                                ${act.actionStatus === 'Completed' ? 'bg-green-50 text-green-700 ring-green-600/20' : 
                                                                act.actionStatus === 'In Progress' ? 'bg-blue-50 text-blue-700 ring-blue-600/20' :
                                                                act.actionStatus === 'Blocked' ? 'bg-red-50 text-red-700 ring-red-600/20' :
                                                                'bg-slate-100 text-slate-600 ring-slate-500/20'}
                                                            `}
                                                        >
                                                            <option>Not Started</option>
                                                            <option>In Progress</option>
                                                            <option>Blocked</option>
                                                            <option>Completed</option>
                                                        </select>
                                                        <button onClick={() => startTrackerEdit(act)} className="text-slate-400 hover:text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity p-1" title="Edit Action">
                                                            <Icon name="pencil" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        };

        // 4. Settings View
        const SettingsView = ({ orgProfile, setOrgProfile, onReset }) => (
            <div className="max-w-2xl mx-auto animate-fade-in">
                <h2 className="text-2xl font-bold text-slate-800 mb-6">Organisation Settings</h2>
                <div className="bg-white rounded-lg shadow-sm border border-slate-200 p-6 space-y-6">
                    <div>
                        <p className="text-sm text-slate-500 mb-4">
                            These details are embedded into the JSON export and are required by NHS England to track readiness across different Trusts and programmes.
                        </p>
                    </div>
                    
                    <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">NHS Trust / Organisation Name</label>
                        <input 
                            type="text" 
                            value={orgProfile.trustName}
                            onChange={(e) => setOrgProfile({...orgProfile, trustName: e.target.value})}
                            className="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" 
                            placeholder="e.g. Newcastle Hospitals NHS Foundation Trust"
                        />
                    </div>
                    
                    <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Programme / Project Name</label>
                        <input 
                            type="text" 
                            value={orgProfile.projectName}
                            onChange={(e) => setOrgProfile({...orgProfile, projectName: e.target.value})}
                            className="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" 
                            placeholder="e.g. EPR Implementation Go-Live 1"
                        />
                    </div>
                    
                    <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Lead Submitter (Change Lead)</label>
                        <input 
                            type="text" 
                            value={orgProfile.leadName}
                            onChange={(e) => setOrgProfile({...orgProfile, leadName: e.target.value})}
                            className="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" 
                        />
                    </div>

                    <div className="pt-6 border-t border-slate-100">
                        <button 
                            onClick={onReset}
                            className="w-full flex items-center justify-center px-4 py-2 border border-red-300 text-red-600 rounded-md shadow-sm text-sm font-medium hover:bg-red-50 transition-colors"
                        >
                            <Icon name="refresh-cw" className="w-4 h-4 mr-2" /> Reset Application Data
                        </button>
                    </div>
                </div>
                
                <div className="mt-8 bg-blue-50 p-6 rounded-lg border border-blue-100">
                    <h3 className="text-blue-800 font-bold mb-2 flex items-center">
                        <Icon name="info" className="w-5 h-5 mr-2" /> Data Privacy & Storage
                    </h3>
                    <p className="text-sm text-blue-900 leading-relaxed">
                        This application operates entirely within your browser. No data is sent to external servers unless you manually export the JSON file. 
                        Your draft data and historical snapshots are saved to your browser's Local Storage to persist between sessions.
                    </p>
                </div>
            </div>
        );

        // Mount the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
